<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance History — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/student.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Attendance History</h1>
      </header>
      <div class="page-content">
        <div style="margin-bottom: 24px;">
          <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--color-text); margin: 0 0 4px 0;">Attendance Records</h2>
          <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0;">Verified check-ins verified by campus club organizers via QR scan</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="label">Total Registered</span>
              <div class="stat-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </div>
            </div>
            <div class="value" id="statTotal">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="label">Present</span>
              <div class="stat-card-icon" style="background:var(--color-success-light);color:var(--color-success);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </div>
            <div class="value" id="statPresent" style="color: var(--color-success);">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="label">Absent</span>
              <div class="stat-card-icon" style="background:var(--color-error-light);color:var(--color-error);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
              </div>
            </div>
            <div class="value" id="statAbsent" style="color: var(--color-error);">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="label">Attendance Rate</span>
              <div class="stat-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              </div>
            </div>
            <div class="value" id="statRate">-</div>
          </div>
        </div>

        <div class="table-container">
          <table id="attendanceTable">
            <thead>
              <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Club</th>
                <th>Status</th>
                <th>Check-in Time</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="5" class="text-center text-muted" style="padding: 24px;">Loading attendance records...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';
    import { renderSkeletonRows } from '/js/utils/helpers.js';
    import apiClient from '/js/api/client.js';

    requireAuth();
    renderNavigation();

    async function loadAttendance() {
      const tbody = document.getElementById('tableBody');
      renderSkeletonRows(tbody, 4, 5);

      try {
        const res = await apiClient.get('/students/me/attendance');
        const data = res.data || [];

        let present = 0, absent = 0, total = data.length;
        data.forEach(r => {
          if (r.status === 'PRESENT') present++;
          else if (r.status === 'ABSENT') absent++;
        });
        const rate = total > 0 ? Math.round((present / total) * 100) : 0;

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statPresent').textContent = present;
        document.getElementById('statAbsent').textContent = absent;
        document.getElementById('statRate').textContent = rate + '%';

        if (total === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" style="padding: 40px 16px; text-align: center;">
                <p style="color: var(--color-text-secondary); margin-bottom: 12px; font-size: 13px;">No attendance verified yet. Present your QR at event entry to get checked in.</p>
                <a href="/pages/student/my-qr.html" class="btn btn-secondary btn-sm">View Universal QR Pass</a>
              </td>
            </tr>
          `;
        } else {
          tbody.innerHTML = data.map(record => {
            const dateStr = record.date ? new Date(record.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '-';
            const timeStr = record.checkInTime ? new Date(record.checkInTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '-';
            const statusBadge = record.status === 'PRESENT'
              ? '<span class="badge badge-success">✓ PRESENT</span>'
              : '<span class="badge badge-error">✕ ABSENT</span>';

            return `
              <tr>
                <td style="font-weight: 600; color: var(--color-text);">${record.eventTitle || 'Unknown Event'}</td>
                <td style="color: var(--color-text-secondary);">${dateStr}</td>
                <td style="color: var(--color-text-secondary);">${record.clubName || 'College Club'}</td>
                <td>${statusBadge}</td>
                <td style="color: var(--color-text-secondary); font-family: monospace; font-size: 13px;">${timeStr}</td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-error" style="padding: 24px;">Failed to load attendance history.</td></tr>';
      }
    }

    loadAttendance();
  </script>
</body>
</html>
