<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/student.css">
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border: 1px solid #E6E6E6; border-radius: 8px; padding: 20px; text-align: center; }
    .stat-val { font-size: 28px; font-weight: bold; color: #171717; }
    .stat-lbl { font-size: 14px; color: #666; margin-top: 8px; }
    @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    
    table { width: 100%; border-collapse: collapse; background: #fff; }
    .table-container { border: 1px solid #E6E6E6; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #E6E6E6; }
    th { background: #F9FAFB; color: #666; font-weight: 500; font-size: 14px; }
    tr:last-child td { border-bottom: none; }
    .status-present { color: #16A34A; font-weight: 500; }
    .status-absent { color: #DC2626; font-weight: 500; }
    .empty-state { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <h1>Attendance History</h1>

        <div class="stats-grid">
          <div class="stat-card"><div class="stat-val" id="statTotal">-</div><div class="stat-lbl">Total Events</div></div>
          <div class="stat-card"><div class="stat-val" id="statPresent" style="color: #16A34A;">-</div><div class="stat-lbl">Present</div></div>
          <div class="stat-card"><div class="stat-val" id="statAbsent" style="color: #DC2626;">-</div><div class="stat-lbl">Absent</div></div>
          <div class="stat-card"><div class="stat-val" id="statRate" style="color: #2563EB;">-</div><div class="stat-lbl">Attendance Rate</div></div>
        </div>

        <div class="table-container">
          <table id="attendanceTable">
            <thead>
              <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Club</th>
                <th>Status</th>
                <th>Check-in Time</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="5" class="empty-state">Loading attendance...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';
    import apiClient from '/js/api/client.js';

    requireAuth();
    renderNavigation('STUDENT');

    async function loadAttendance() {
      try {
        const res = await apiClient.get('/students/me/attendance');
        const data = res.data || [];
        
        let present = 0, absent = 0, total = data.length;
        data.forEach(r => {
          if (r.status === 'PRESENT') present++;
          else if (r.status === 'ABSENT') absent++;
        });
        const rate = total > 0 ? Math.round((present / total) * 100) : 0;

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statPresent').textContent = present;
        document.getElementById('statAbsent').textContent = absent;
        document.getElementById('statRate').textContent = rate + '%';

        const tbody = document.getElementById('tableBody');
        if (total === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No attendance records yet</td></tr>';
        } else {
          tbody.innerHTML = data.map(record => {
            const dateStr = new Date(record.date).toLocaleDateString();
            const timeStr = record.checkInTime ? new Date(record.checkInTime).toLocaleTimeString() : '-';
            const statusClass = record.status === 'PRESENT' ? 'status-present' : 'status-absent';
            const statusText = record.status === 'PRESENT' ? 'Present' : 'Absent';
            
            return `
              <tr>
                <td style="font-weight: 500;">${record.eventTitle || 'Unknown Event'}</td>
                <td>${dateStr}</td>
                <td>${record.clubName || '-'}</td>
                <td class="${statusClass}">${statusText}</td>
                <td>${timeStr}</td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="empty-state" style="color:#DC2626;">Failed to load attendance records.</td></tr>';
      }
    }

    loadAttendance();
  </script>
</body>
</html>
