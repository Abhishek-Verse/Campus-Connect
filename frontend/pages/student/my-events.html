<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Events — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/student.css">
  <style>
    .tabs { display: flex; border-bottom: 1px solid #E6E6E6; margin-bottom: 24px; }
    .tab { padding: 12px 24px; cursor: pointer; color: #666; border-bottom: 2px solid transparent; font-weight: 500; }
    .tab.active { color: #2563EB; border-bottom-color: #2563EB; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #E6E6E6; }
    th { color: #666; font-weight: 500; font-size: 14px; background: #F9FAFB; }
    tr:hover { background: #f9fafb; cursor: pointer; }
    .status-present { color: #16A34A; font-weight: 500; }
    .status-absent { color: #DC2626; font-weight: 500; }
    .status-pending { color: #8A8A8A; }
    .empty-state { text-align: center; padding: 40px; color: #666; }
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr { display: block; }
      th { display: none; }
      td { position: relative; padding-left: 50%; border-bottom: none; }
      td:before { position: absolute; top: 12px; left: 16px; width: 45%; padding-right: 10px; white-space: nowrap; font-weight: bold; font-size: 12px; color: #666; }
      td:nth-of-type(1):before { content: "Event"; }
      td:nth-of-type(2):before { content: "Date"; }
      td:nth-of-type(3):before { content: "Venue"; }
      td:nth-of-type(4):before { content: "Attendance"; }
      tr { border-bottom: 1px solid #E6E6E6; padding-bottom: 12px; margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <h1>My Events</h1>
        
        <div class="tabs">
          <div class="tab active" data-filter="upcoming">Upcoming</div>
          <div class="tab" data-filter="past">Past</div>
          <div class="tab" data-filter="all">All</div>
        </div>

        <div style="background: #fff; border: 1px solid #E6E6E6; border-radius: 8px; overflow: hidden;">
          <table id="eventsTable">
            <thead>
              <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Attendance</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="4" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';
    import apiClient from '/js/api/client.js';

    requireAuth();
    renderNavigation('STUDENT');

    let allEvents = [];
    let currentFilter = 'upcoming';

    const tableBody = document.getElementById('tableBody');
    const tabs = document.querySelectorAll('.tab');

    tabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        tabs.forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-filter');
        renderTable();
      });
    });

    async function loadMyEvents() {
      try {
        const res = await apiClient.get('/students/me/events');
        allEvents = res.data || [];
        renderTable();
      } catch (err) {
        tableBody.innerHTML = '<tr><td colspan="4" class="empty-state" style="color:#DC2626;">Failed to load events.</td></tr>';
      }
    }

    function getEventEndDateTime(item) {
      const d = new Date(item.eventDate || item.date);
      const [h = '23', m = '59'] = (item.endTime || '23:59').split(':');
      d.setHours(parseInt(h), parseInt(m), 59, 999);
      return d;
    }

    function renderTable() {
      const now = new Date();
      let filtered = allEvents;
      
      if (currentFilter === 'upcoming') {
        filtered = allEvents.filter(e => getEventEndDateTime(e) >= now);
      } else if (currentFilter === 'past') {
        filtered = allEvents.filter(e => getEventEndDateTime(e) < now);
      }

      if (filtered.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4" class="empty-state">No registered events yet.</td></tr>';
        return;
      }

      tableBody.innerHTML = filtered.map(item => {
        const dateStr = new Date(item.eventDate || item.date).toLocaleDateString();
        let attClass = 'status-pending';
        let attText = 'Pending';
        if (item.attendanceStatus === 'PRESENT') { attClass = 'status-present'; attText = 'Present'; }
        else if (item.attendanceStatus === 'ABSENT') { attClass = 'status-absent'; attText = 'Absent'; }

        return `
          <tr onclick="window.location.href='/pages/student/event-details.html?id=${item.eventId}'">
            <td style="font-weight: 500;">${item.eventTitle || 'Event'}</td>
            <td>${dateStr}</td>
            <td>${item.venue || '-'}</td>
            <td class="${attClass}">${attText}</td>
          </tr>
        `;
      }).join('');
    }

    loadMyEvents();
  </script>
</body>
</html>
