<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Events — CampusHub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusHub">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/student.css">
  <style>
    .status-present { color: var(--color-success); font-weight: 600; }
    .status-absent { color: var(--color-error); font-weight: 600; }
    .status-pending { color: var(--color-text-muted); }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>My Registered Events</h1>
      </header>
      <div class="page-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
          <div>
            <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--color-text); margin: 0 0 4px 0;">My Registrations</h2>
            <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0;">Track upcoming activities and verified attendance records</p>
          </div>
          <a href="/pages/student/my-qr.html" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>My QR Pass</span>
          </a>
        </div>

        <div class="tabs" style="margin-bottom: 20px;">
          <div class="tab active" data-filter="upcoming">Upcoming</div>
          <div class="tab" data-filter="past">Past</div>
          <div class="tab" data-filter="all">All Registrations</div>
        </div>

        <div class="table-container">
          <table id="eventsTable">
            <thead>
              <tr>
                <th>Event Name</th>
                <th>Date & Time</th>
                <th>Venue</th>
                <th>Attendance</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="5" class="text-center text-muted" style="padding: 24px;">Loading registrations...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';
    import { renderSkeletonRows } from '/js/utils/helpers.js';
    import apiClient from '/js/api/client.js';

    requireAuth();
    renderNavigation();

    let allEvents = [];
    let currentFilter = 'upcoming';

    const tableBody = document.getElementById('tableBody');
    const tabs = document.querySelectorAll('.tab');

    tabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        tabs.forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-filter');
        renderTable();
      });
    });

    async function loadMyEvents() {
      renderSkeletonRows(tableBody, 4, 5);
      try {
        const res = await apiClient.get('/students/me/events');
        allEvents = res.data || [];
        renderTable();
      } catch (err) {
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-error" style="padding: 24px;">Failed to load events.</td></tr>';
      }
    }

    function getEventEndDateTime(item) {
      const d = new Date(item.eventDate || item.date);
      const [h = '23', m = '59'] = (item.endTime || '23:59').split(':');
      d.setHours(parseInt(h), parseInt(m), 59, 999);
      return d;
    }

    function renderTable() {
      const now = new Date();
      let filtered = allEvents;

      if (currentFilter === 'upcoming') {
        filtered = allEvents.filter(e => getEventEndDateTime(e) >= now);
      } else if (currentFilter === 'past') {
        filtered = allEvents.filter(e => getEventEndDateTime(e) < now);
      }

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" style="padding: 40px 16px; text-align: center;">
              <p style="color: var(--color-text-secondary); margin-bottom: 12px; font-size: 13px;">No registered events in this view.</p>
              <a href="/pages/student/events.html" class="btn btn-primary btn-sm">Explore Campus Events</a>
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filtered.map(item => {
        const dateStr = new Date(item.eventDate || item.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const timeStr = item.startTime ? ` • ${item.startTime}` : '';
        let attBadge = '<span class="badge badge-neutral">PENDING</span>';
        if (item.attendanceStatus === 'PRESENT') {
          attBadge = '<span class="badge badge-success">✓ PRESENT</span>';
        } else if (item.attendanceStatus === 'ABSENT') {
          attBadge = '<span class="badge badge-error">✕ ABSENT</span>';
        }

        return `
          <tr>
            <td style="font-weight: 600; color: var(--color-text);">
              <a href="/pages/student/event-details.html?id=${item.eventId}" style="color: inherit; text-decoration: none;">
                ${item.eventTitle || 'Event'}
              </a>
            </td>
            <td style="color: var(--color-text-secondary);">${dateStr}${timeStr}</td>
            <td style="color: var(--color-text-secondary);">${item.venue || '-'}</td>
            <td>${attBadge}</td>
            <td>
              <a href="/pages/student/event-details.html?id=${item.eventId}" class="btn btn-secondary btn-sm" style="padding: 4px 10px; font-size: 12px;">
                View
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    loadMyEvents();
  </script>
</body>
</html>
