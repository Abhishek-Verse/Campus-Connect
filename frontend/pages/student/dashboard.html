<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — CampusHub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusHub">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/student.css">
  <style>
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    .section-card {
      background: var(--color-surface);
      border: 1.5px solid var(--color-ink);
      border-radius: var(--radius-card);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 4px 4px 0 var(--color-ink);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid rgba(24, 22, 17, 0.1);
    }
    .section-header h2 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 0;
    }
    .event-list, .notice-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .event-item {
      border: 1.5px solid var(--color-ink);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--color-panel);
      box-shadow: 2px 2px 0 var(--color-ink);
      transition: all 0.15s ease;
    }
    .event-item:hover {
      background: var(--color-cream);
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--color-ink);
    }
    .notice-item {
      border: 1.5px solid rgba(24, 22, 17, 0.15);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      background: var(--color-panel);
      transition: border-color 0.15s;
    }
    .notice-item:hover {
      border-color: var(--color-ink);
    }
    .notice-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }
    .btn-qr-hero {
      background: var(--color-ink);
      color: var(--color-cream);
      padding: 10px 18px;
      border-radius: var(--radius-button);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--color-ink);
      box-shadow: 4px 4px 0 var(--color-flame);
      transition: all 0.15s ease;
    }
    .btn-qr-hero:hover {
      transform: translate(-1px, -1px);
      box-shadow: 6px 6px 0 var(--color-flame);
      color: var(--color-cream);
    }
      background: var(--color-inverse-surface);
      color: var(--color-text-inverse);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Student Dashboard</h1>
      </header>
      <div class="page-content">
        <div class="dashboard-header">
          <div>
            <h2 id="greeting" style="font-size: 1.5rem; font-weight: 800; color: var(--color-text); margin: 0 0 4px 0;">Welcome back!</h2>
            <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0;">Access your Universal QR pass, registered events, and attendance records</p>
          </div>
          <a href="/pages/student/my-qr.html" class="btn-qr-hero">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h2v2h-2z"></path><path d="M18 14h3v3h-3z"></path><path d="M14 18h3v3h-3z"></path><path d="M19 19h2v2h-2z"></path></svg>
            <span>Show My QR Pass</span>
          </a>
        </div>

        <div class="stats-row" id="statsRow">
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="label">Registered Events</span>
              <div class="stat-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg>
              </div>
            </div>
            <div class="value" id="statRegistered">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="label">Attended Events</span>
              <div class="stat-card-icon" style="background:var(--color-success-light);color:var(--color-success);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              </div>
            </div>
            <div class="value" id="statAttended" style="color:var(--color-success);">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="label">Upcoming Events</span>
              <div class="stat-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </div>
            </div>
            <div class="value" id="statUpcoming">0</div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="section-card">
            <div class="section-header">
              <h2>Upcoming Campus Events</h2>
              <a href="/pages/student/events.html" class="btn btn-secondary btn-sm">Explore All</a>
            </div>
            <div id="upcomingEventsContainer" class="event-list">
              <div class="empty-state">
                <div class="skeleton skeleton-text" style="width: 80%; height: 16px;"></div>
                <div class="skeleton skeleton-text" style="width: 60%; height: 14px;"></div>
              </div>
            </div>
          </div>

          <div class="section-card">
            <div class="section-header">
              <h2>Official Notices</h2>
            </div>
            <div id="recentNoticesContainer" class="notice-list">
              <div class="empty-state">
                <div class="skeleton skeleton-text" style="width: 80%; height: 16px;"></div>
                <div class="skeleton skeleton-text" style="width: 50%; height: 14px;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';
    import apiClient from '/js/api/client.js';

    const user = requireAuth();
    renderNavigation();

    if (user?.name) {
      document.getElementById('greeting').textContent = `Welcome back, ${user.name}!`;
    }

    async function loadDashboard() {
      try {
        const [myEventsRes, eventsRes, noticesRes] = await Promise.all([
          apiClient.get('/students/me/events').catch(() => ({ data: [] })),
          apiClient.get('/events?limit=4&status=PUBLISHED').catch(() => ({ data: [] })),
          apiClient.get('/notices?limit=3').catch(() => ({ data: [] }))
        ]);

        const myEvents = myEventsRes.data || [];
        const registeredCount = myEvents.length;
        const attendedCount = myEvents.filter(e => e.attended || e.attendanceStatus === 'PRESENT').length;
        const upcomingCount = (eventsRes.data || []).length;

        document.getElementById('statRegistered').textContent = registeredCount;
        document.getElementById('statAttended').textContent = attendedCount;
        document.getElementById('statUpcoming').textContent = upcomingCount;

        // Render upcoming events
        const eventsContainer = document.getElementById('upcomingEventsContainer');
        const events = eventsRes.data || [];
        if (events.length > 0) {
          eventsContainer.innerHTML = events.slice(0, 3).map(event => {
            const eventDate = new Date(event.date || event.eventDate);
            const dateStr = eventDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            return `
              <div class="event-item">
                <div style="flex: 1; min-width: 0;">
                  <h3 style="margin: 0 0 4px 0; font-size: 14px; font-weight: 700; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${event.title}</h3>
                  <div style="font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 8px;">
                    <span>${dateStr} • ${event.startTime || ''}</span>
                    <span>•</span>
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${event.venue || 'Campus Venue'}</span>
                  </div>
                </div>
                <a href="/pages/student/event-details.html?id=${event.id}" class="btn btn-secondary btn-sm" style="white-space: nowrap;">Details</a>
              </div>
            `;
          }).join('');
        } else {
          eventsContainer.innerHTML = `
            <div class="empty-state" style="padding: 24px 16px;">
              <p style="margin-bottom: 12px;">No published events available right now.</p>
              <a href="/pages/student/events.html" class="btn btn-secondary btn-sm">Browse Events Directory</a>
            </div>
          `;
        }

        // Render notices
        const noticesContainer = document.getElementById('recentNoticesContainer');
        const notices = noticesRes.data || [];
        if (notices.length > 0) {
          noticesContainer.innerHTML = notices.map(notice => {
            const noticeDate = notice.publishedAt || notice.createdAt;
            const dateDisplay = noticeDate ? new Date(noticeDate).toLocaleDateString() : 'Recent';
            const priorityBadge = notice.priority === 'URGENT'
              ? `<span class="badge badge-error">URGENT</span>`
              : (notice.priority === 'IMPORTANT' ? `<span class="badge badge-warning">IMPORTANT</span>` : '');

            return `
              <div class="notice-item">
                <div class="notice-item-header">
                  <h4 style="margin: 0; font-size: 13px; font-weight: 700; color: var(--color-text);">${notice.title}</h4>
                  ${priorityBadge}
                </div>
                <p style="margin: 4px 0 6px 0; font-size: 12px; color: var(--color-text-secondary); line-height: 1.45;">${notice.content || ''}</p>
                <div style="font-size: 11px; color: var(--color-text-muted);">${dateDisplay}</div>
              </div>
            `;
          }).join('');
        } else {
          noticesContainer.innerHTML = `
            <div class="empty-state" style="padding: 24px 16px;">
              <p>No active campus announcements.</p>
            </div>
          `;
        }

      } catch (err) {
        console.error('Dashboard load error:', err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
