<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My QR — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/student.css">
  <style>
    .qr-container { max-width: 420px; margin: 40px auto; background: #fff; border: 1px solid #E6E6E6; border-radius: 12px; padding: 40px 24px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .student-name { font-size: 24px; font-weight: 700; color: #171717; margin: 0 0 4px 0; }
    .roll-number { font-size: 16px; color: #666666; margin: 0 0 24px 0; font-weight: 500; }
    #qrcode { display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; min-height: 240px; }
    #qrcode canvas, #qrcode img { margin: 0 auto; display: block; border: 8px solid #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .qr-badge { display: inline-block; font-family: monospace; font-size: 14px; background: #eff6ff; color: #2563eb; padding: 6px 14px; border-radius: 999px; font-weight: 600; margin-bottom: 20px; letter-spacing: 1px; }
    .instruction { color: #4B5563; font-size: 14px; line-height: 1.5; margin: 0; }
    .error-msg { color: #DC2626; padding: 20px; font-weight: 500; }
  </style>
  <script src="/js/lib/qrcode.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="qr-container">
          <h1 class="student-name" id="studentName">Student Name</h1>
          <p class="roll-number" id="rollNo">Loading details...</p>
          
          <div id="qrcode">
            <span style="color:#8A8A8A;">Generating QR Code...</span>
          </div>
          
          <div id="qrTokenBadge" class="qr-badge" style="display: none;">CH-XXXXXXXX</div>
          
          <p class="instruction">Show this QR at registered events.<br>This Universal QR works for all CampusHub events.</p>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth, getUser } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';
    import apiClient from '/js/api/client.js';

    const currentUser = requireAuth();
    renderNavigation('STUDENT');

    const nameEl = document.getElementById('studentName');
    const rollEl = document.getElementById('rollNo');
    const qrContainer = document.getElementById('qrcode');
    const badgeEl = document.getElementById('qrTokenBadge');

    if (currentUser?.name) nameEl.textContent = currentUser.name;
    if (currentUser?.rollNo) rollEl.textContent = `Roll No: ${currentUser.rollNo}`;

    async function loadQR() {
      try {
        // Fetch full profile and QR token from API
        const [meRes, qrRes] = await Promise.all([
          apiClient.get('/students/me').catch(() => null),
          apiClient.get('/students/me/qr').catch(() => null)
        ]);

        const profile = meRes?.data || currentUser;
        if (profile?.name) nameEl.textContent = profile.name;
        if (profile?.rollNo) rollEl.textContent = `Roll No: ${profile.rollNo}`;

        const token = qrRes?.data?.qrToken || profile?.qrToken;
        
        if (!token) {
          throw new Error('No QR token received from server');
        }

        badgeEl.textContent = token;
        badgeEl.style.display = 'inline-block';
        qrContainer.innerHTML = '';

        // Generate QR code using local qrcode.min.js
        if (typeof QRCode !== 'undefined') {
          new QRCode(qrContainer, {
            text: token,
            width: 220,
            height: 220,
            colorDark: "#171717",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel ? QRCode.CorrectLevel.H : 2
          });
        } else {
          // Fallback image using standard QR API if library not loaded
          qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(token)}" alt="QR Code" style="width:220px;height:220px;">`;
        }

      } catch (err) {
        console.error('Failed to generate QR:', err);
        qrContainer.innerHTML = `<div class="error-msg">Failed to generate QR code.<br><small style="color:#666;">${err.message || ''}</small></div>`;
      }
    }

    loadQR();
  </script>
</body>
</html>
