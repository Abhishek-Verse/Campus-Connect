<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My QR — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/student.css">
  <style>
    .qr-container { max-width: 400px; margin: 40px auto; background: #fff; border: 1px solid #E6E6E6; border-radius: 12px; padding: 40px 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .student-name { font-size: 24px; font-weight: 600; color: #171717; margin: 0 0 4px 0; }
    .roll-number { font-size: 16px; color: #666666; margin: 0 0 32px 0; }
    #qrcode { display: flex; justify-content: center; margin-bottom: 24px; min-height: 250px; align-items: center; }
    .instruction { color: #4B5563; font-size: 14px; line-height: 1.5; margin: 0; }
    .error-msg { color: #DC2626; padding: 20px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="qr-container">
          <h1 class="student-name" id="studentName">Student Name</h1>
          <p class="roll-number" id="rollNo">Roll No</p>
          
          <div id="qrcode">
            <span style="color:#8A8A8A;">Generating QR Code...</span>
          </div>
          
          <p class="instruction">Show this QR at registered events.<br>This QR works for all CampusHub events.</p>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth, getUser } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';
    import apiClient from '/js/api/client.js';

    const user = requireAuth();
    renderNavigation('STUDENT');

    document.getElementById('studentName').textContent = user?.name || 'Student Name';
    document.getElementById('rollNo').textContent = user?.rollNo || 'Roll No';

    async function loadQR() {
      try {
        const res = await apiClient.get('/students/me/qr');
        const token = res.data?.qrToken;
        
        if (token) {
          const qrContainer = document.getElementById('qrcode');
          qrContainer.innerHTML = '';
          QRCode.toCanvas(token, {
            width: 250,
            margin: 2,
            color: { dark: '#171717', light: '#ffffff' }
          }, function (err, canvas) {
            if (err) throw err;
            qrContainer.appendChild(canvas);
          });
        } else {
          throw new Error('No QR token received');
        }
      } catch (err) {
        document.getElementById('qrcode').innerHTML = '<div class="error-msg">Failed to generate QR code.</div>';
      }
    }

    loadQR();
  </script>
</body>
</html>
