<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/student.css">
  <style>
    .event-container {
      max-width: 860px;
      margin: 0 auto;
    }
    .back-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      text-decoration: none;
      margin-bottom: 16px;
    }
    .back-nav-link:hover {
      color: var(--color-primary);
      text-decoration: none;
    }
    .event-hero-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .event-poster-hero {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: var(--color-surface-hover);
      display: block;
    }
    .event-hero-body {
      padding: 24px 28px;
    }
    .badges-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .badge-pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 4px;
    }
    .badge-category {
      background: var(--color-primary-light);
      color: var(--color-primary-active);
      border: 1px solid var(--color-primary-border);
    }
    .badge-status-published {
      background: var(--color-success-light);
      color: var(--color-success);
      border: 1px solid var(--color-success-border);
    }
    .badge-status-completed {
      background: var(--color-surface-subtle);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
    }
    .event-headline {
      font-size: 26px;
      font-weight: 800;
      color: var(--color-text);
      margin: 0 0 16px 0;
      line-height: 1.3;
    }
    .meta-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .meta-card {
      background: var(--color-surface-subtle);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meta-card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .meta-card-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
    }
    .content-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .section-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text);
      margin: 0 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border-subtle);
    }
    .description-text {
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .action-bar {
      position: sticky;
      bottom: 20px;
      background: var(--color-surface);
      padding: 16px 24px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      z-index: 30;
    }
    .btn-action {
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn-action-primary {
      background: var(--color-button-primary);
      color: var(--color-button-primary-text);
    }
    .btn-action-primary:hover:not(:disabled) {
      background: var(--color-button-primary-hover);
    }
    .btn-action-success {
      background: var(--color-success);
      color: var(--color-text-inverse);
      cursor: default;
    }
    .btn-action-cancel {
      background: transparent;
      color: var(--color-error);
      border: 1px solid var(--color-error-border);
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-action-cancel:hover {
      background: var(--color-error-light);
    }
    .btn-action-disabled {
      background: var(--color-surface-hover);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      cursor: not-allowed;
    }
    .toast-popup {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 1000;
      box-shadow: var(--shadow-md);
    }
    .toast-popup.success {
      background: var(--color-success);
      color: var(--color-text-inverse);
    }
    .toast-popup.error {
      background: var(--color-error);
      color: var(--color-text-inverse);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="event-container" id="content">
          <div style="text-align: center; padding: 48px; color: var(--color-text-secondary);">
            <div style="font-size: 14px;">Loading event details...</div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <div id="toastPopup" class="toast-popup"></div>

  <script type="module">
    import { requireAuth } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';
    import apiClient from '/js/api/client.js';

    requireAuth();
    renderNavigation('STUDENT');

    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');
    const toast = document.getElementById('toastPopup');

    function showToast(msg, type = 'success') {
      toast.textContent = msg;
      toast.className = `toast-popup ${type}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3200);
    }

    async function loadEvent() {
      if (!eventId) {
        document.getElementById('content').innerHTML = `
          <div style="padding: 24px; background: var(--color-error-light); border: 1px solid var(--color-error-border); border-radius: 8px; color: var(--color-error);">
            Invalid or missing event ID. <a href="/pages/student/events.html" style="color: var(--color-error); font-weight: 600;">Return to events list</a>
          </div>
        `;
        return;
      }

      try {
        const [eventRes, myEventsRes] = await Promise.all([
          apiClient.get(`/events/${eventId}`),
          apiClient.get('/students/me/events').catch(() => ({ data: [] }))
        ]);

        const event = eventRes.data;
        let isRegistered = myEventsRes.data?.some(e => e.eventId === eventId) || false;

        const now = new Date();
        const eventDate = new Date(event.date || event.eventDate);
        const [endHour = '23', endMin = '59'] = (event.endTime || '23:59').split(':');
        const eventEndDateTime = new Date(eventDate);
        eventEndDateTime.setHours(parseInt(endHour), parseInt(endMin), 0, 0);

        const deadline = event.registrationDeadline ? new Date(event.registrationDeadline) : eventEndDateTime;
        const isClosed = event.status === 'CANCELLED' || now > deadline;
        const isCompleted = event.status === 'COMPLETED';
        let registeredCount = event.registeredCount || 0;
        let seatsLeft = event.capacity ? (event.capacity - registeredCount) : null;
        let isFull = seatsLeft !== null && seatsLeft <= 0;

        function renderUI() {
          const dateStr = eventDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
          const seatsText = seatsLeft !== null ? `${Math.max(0, seatsLeft)} seats remaining` : 'Unlimited Seats';

          let actionControls = '';
          if (isCompleted) {
            actionControls = `<button class="btn-action btn-action-disabled" disabled>Event Completed</button>`;
          } else if (isRegistered) {
            actionControls = `
              <div style="display: flex; align-items: center; gap: 10px;">
                <button class="btn-action btn-action-success" disabled>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span>Registered</span>
                </button>
                <button id="btnCancelReg" class="btn-action-cancel">Cancel Registration</button>
              </div>
            `;
          } else if (isClosed) {
            actionControls = `<button class="btn-action btn-action-disabled" disabled>Registration Closed</button>`;
          } else if (isFull) {
            actionControls = `<button class="btn-action btn-action-disabled" disabled>Registration Full</button>`;
          } else {
            actionControls = `
              <button id="btnRegister" class="btn-action btn-action-primary">
                <span>Register Now</span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
            `;
          }

          document.getElementById('content').innerHTML = `
            <a href="/pages/student/events.html" class="back-nav-link">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
              <span>Back to all events</span>
            </a>

            <div class="event-hero-card">
              ${event.posterUrl ? `<img src="${event.posterUrl}" class="event-poster-hero" alt="Event Poster">` : ''}
              <div class="event-hero-body">
                <div class="badges-row">
                  <span class="badge-pill badge-category">${event.category || 'EVENT'}</span>
                  <span class="badge-pill ${isCompleted ? 'badge-status-completed' : 'badge-status-published'}">${isCompleted ? 'COMPLETED' : (event.status || 'PUBLISHED')}</span>
                </div>
                <h1 class="event-headline">${event.title}</h1>

                <div class="meta-cards-grid">
                  <div class="meta-card">
                    <span class="meta-card-label">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                      Date & Time
                    </span>
                    <span class="meta-card-value">${dateStr}</span>
                    <span style="font-size: 12px; color: var(--color-text-secondary);">${event.startTime || ''} - ${event.endTime || ''}</span>
                  </div>

                  <div class="meta-card">
                    <span class="meta-card-label">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                      Venue Location
                    </span>
                    <span class="meta-card-value">${event.venue || 'Campus Venue'}</span>
                  </div>

                  <div class="meta-card">
                    <span class="meta-card-label">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                      Capacity
                    </span>
                    <span class="meta-card-value" id="seatsValDisplay">${seatsText}</span>
                  </div>

                  <div class="meta-card">
                    <span class="meta-card-label">Organized By</span>
                    <span class="meta-card-value">${event.club?.name || event.clubName || 'College Club'}</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="content-card">
              <h2 class="section-heading">About This Event</h2>
              <div class="description-text">${event.description || 'No description provided for this event.'}</div>

              ${event.rules && (Array.isArray(event.rules) ? event.rules.length > 0 : String(event.rules).trim()) ? `
                <h2 class="section-heading" style="margin-top: 24px;">Guidelines & Rules</h2>
                <div class="description-text">${Array.isArray(event.rules) ? event.rules.map((r, i) => `${i + 1}. ${r}`).join('\n') : event.rules}</div>
              ` : ''}
            </div>

            <div class="action-bar">
              <div>
                <div style="font-size: 13px; font-weight: 600; color: var(--color-text);">
                  ${isRegistered ? 'Your Spot is Confirmed' : (isClosed ? 'Registration is closed' : 'Registration Open')}
                </div>
                <div style="font-size: 12px; color: var(--color-text-secondary);">
                  ${!isRegistered && !isClosed && !isFull && !isCompleted ? `Deadline: ${deadline.toLocaleDateString()}` : 'Show your Universal QR code at entry'}
                </div>
              </div>
              <div id="actionControlsContainer">${actionControls}</div>
            </div>
          `;

          // Event Listeners for Instant Optimistic Registration
          const btnReg = document.getElementById('btnRegister');
          if (btnReg) {
            btnReg.addEventListener('click', async () => {
              btnReg.disabled = true;
              btnReg.innerHTML = '<span>Registering...</span>';
              try {
                await apiClient.post(`/events/${eventId}/register`, {});
                isRegistered = true;
                if (seatsLeft !== null) seatsLeft--;
                showToast('Registration confirmed! Entry pass added to your Universal QR.');
                renderUI();
              } catch (err) {
                const msg = err.message || err.details?.message || 'Unable to register for event.';
                showToast(msg, 'error');
                btnReg.disabled = false;
                btnReg.innerHTML = '<span>Register Now</span>';
              }
            });
          }

          const btnCancel = document.getElementById('btnCancelReg');
          if (btnCancel) {
            btnCancel.addEventListener('click', async () => {
              if (!confirm('Are you sure you want to cancel your registration?')) return;
              btnCancel.disabled = true;
              btnCancel.textContent = 'Cancelling...';
              try {
                await apiClient.delete(`/events/${eventId}/register`);
                isRegistered = false;
                if (seatsLeft !== null) seatsLeft++;
                showToast('Registration cancelled.');
                renderUI();
              } catch (err) {
                showToast(err.message || 'Unable to cancel registration.', 'error');
                btnCancel.disabled = false;
                btnCancel.textContent = 'Cancel Registration';
              }
            });
          }
        }

        renderUI();

      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div style="padding: 24px; background: var(--color-error-light); border: 1px solid var(--color-error-border); border-radius: 8px; color: var(--color-error);">
            Failed to load event details. Please verify your connection and try again.
            <div style="margin-top: 12px;"><a href="/pages/student/events.html" class="btn btn-secondary btn-sm">Back to Events</a></div>
          </div>
        `;
      }
    }

    loadEvent();
  </script>
</body>
</html>
