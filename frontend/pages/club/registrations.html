<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registrations — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/club.css">
  <style>
    .filter-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .form-control { padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 6px; font-family: inherit; flex: 1; min-width: 200px; }
    .summary-cards { display: flex; gap: 16px; margin-bottom: 24px; }
    .summary-card { flex: 1; background: var(--color-surface); padding: 16px; border-radius: 8px; border: 1px solid var(--color-border); text-align: center; }
    .summary-card h4 { margin: 0 0 8px 0; color: var(--color-text-secondary); font-size: 14px; font-weight: 500; }
    .summary-card .val { font-size: 24px; font-weight: 600; color: var(--color-text); }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Registrations</h1>
      </header>
      <div class="page-content">

        <div class="filter-bar">
          <select id="eventSelector" class="form-control" style="max-width: 300px;">
            <option value="">Select an Event...</option>
          </select>
          <input type="text" id="searchInput" class="form-control" placeholder="Search by name, roll no, or email...">
        </div>

        <div id="contentArea" style="display: none;">
          <div class="summary-cards">
            <div class="summary-card">
              <h4>Registered / Capacity</h4>
              <div class="val" id="sumCapacity">0 / 0</div>
            </div>
            <div class="summary-card">
              <h4>Available Seats</h4>
              <div class="val" id="sumAvailable">0</div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <table class="table" style="width: 100%; text-align: left;">
                <thead>
                  <tr>
                    <th>Roll No</th>
                    <th>ERP ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Div</th>
                    <th>Registered At</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="registrationsTable">
                  <tr><td colspan="7" class="text-center">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="emptyState" class="text-center text-muted" style="margin-top: 40px; display: none;">
          Please select an event to view registrations.
        </div>

      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth, requireRole } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';

    requireAuth();
    requireRole('CLUB_MEMBER');
    renderNavigation('CLUB_MEMBER');

    const eventSelector = document.getElementById('eventSelector');
    const searchInput = document.getElementById('searchInput');
    const contentArea = document.getElementById('contentArea');
    const emptyState = document.getElementById('emptyState');
    const registrationsTable = document.getElementById('registrationsTable');

    let allRegistrations = [];

    async function loadEvents() {
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch('/api/v1/events?scope=club', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (data.data && data.data.length > 0) {
          data.data.forEach(ev => {
            const opt = document.createElement('option');
            opt.value = ev.id;
            opt.textContent = ev.title;
            opt.dataset.capacity = ev.capacity;
            opt.dataset.regCount = ev.registrationCount || 0;
            eventSelector.appendChild(opt);
          });

          const urlParams = new URLSearchParams(window.location.search);
          const initialEventId = urlParams.get('eventId');
          if (initialEventId) {
            eventSelector.value = initialEventId;
            loadRegistrations(initialEventId);
          } else if (data.data.length > 0) {
            eventSelector.value = data.data[0].id;
            loadRegistrations(data.data[0].id);
          } else {
            emptyState.style.display = 'block';
          }
        }
      } catch (err) {
        console.error('Error loading events:', err);
      }
    }

    async function loadRegistrations(eventId) {
      emptyState.style.display = 'none';
      contentArea.style.display = 'block';
      registrationsTable.innerHTML = '<tr><td colspan="7" class="text-center">Loading registrations...</td></tr>';

      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch(`/api/v1/events/${eventId}/registrations`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        allRegistrations = data.data || [];

        const opt = eventSelector.options[eventSelector.selectedIndex];
        const capacity = parseInt(opt.dataset.capacity || 0);
        const regCount = allRegistrations.length;

        document.getElementById('sumCapacity').textContent = `${regCount} / ${capacity}`;
        document.getElementById('sumAvailable').textContent = Math.max(0, capacity - regCount);

        renderTable();
      } catch (err) {
        console.error(err);
        registrationsTable.innerHTML = '<tr><td colspan="7" class="text-center text-error">Failed to load registrations.</td></tr>';
      }
    }

    function renderTable() {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = allRegistrations.filter(r =>
        (r.studentName && r.studentName.toLowerCase().includes(q)) ||
        (r.rollNo && r.rollNo.toLowerCase().includes(q)) ||
        (r.erpId && r.erpId.toLowerCase().includes(q)) ||
        (r.department && r.department.toLowerCase().includes(q)) ||
        (r.division && r.division.toLowerCase().includes(q)) ||
        (r.email && r.email.toLowerCase().includes(q))
      );

      if (filtered.length === 0) {
        registrationsTable.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No registrations found.</td></tr>';
        return;
      }

      registrationsTable.innerHTML = filtered.map(r => `
        <tr>
          <td><strong>${r.rollNo || '-'}</strong></td>
          <td>${r.erpId || '-'}</td>
          <td>${r.studentName || '-'}</td>
          <td>${r.department || '-'}</td>
          <td>${r.division || '-'}</td>
          <td>${new Date(r.createdAt).toLocaleString()}</td>
          <td><span class="badge" style="background:var(--color-success-light); color:var(--color-success); padding:4px 8px; border-radius:999px; font-size:12px;">${r.status || 'CONFIRMED'}</span></td>
        </tr>
      `).join('');
    }

    eventSelector.addEventListener('change', (e) => {
      if (e.target.value) {
        loadRegistrations(e.target.value);
        // update url without reload
        window.history.replaceState({}, '', `?eventId=${e.target.value}`);
      } else {
        contentArea.style.display = 'none';
        emptyState.style.display = 'block';
      }
    });

    searchInput.addEventListener('input', renderTable);

    document.addEventListener('DOMContentLoaded', loadEvents);
  </script>
</body>
</html>
