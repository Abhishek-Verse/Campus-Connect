<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Scanner — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/club.css">
  <link rel="stylesheet" href="/css/scanner.css">
  <style>
    .scanner-container { max-width: 600px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; border: 1px solid #E6E6E6; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    #reader { width: 100%; min-height: 60vh; border-radius: 8px; overflow: hidden; background: #000; }
    .status-area { margin-top: 24px; padding: 16px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: 600; min-height: 80px; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: all 0.3s; }
    
    .status-neutral { background: #F3F4F6; color: #4B5563; }
    .status-processing { background: #DBEAFE; color: #1D4ED8; }
    .status-success { background: #DCFCE7; color: #166534; }
    .status-warning { background: #FEF3C7; color: #B45309; }
    .status-error { background: #FEE2E2; color: #991B1B; }
    
    .status-detail { font-size: 14px; font-weight: normal; margin-top: 4px; }
    
    .event-bar { background: #171717; color: #fff; padding: 16px; border-radius: 8px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .event-bar h2 { margin: 0; font-size: 18px; color: #fff; }
    .event-bar p { margin: 4px 0 0 0; color: #A3A3A3; font-size: 14px; }
    
    .controls { display: flex; gap: 16px; margin-top: 16px; justify-content: center; }
    
    .recent-scans { margin-top: 32px; }
    .recent-scans h3 { font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #e6e6e6; padding-bottom: 8px; }
    .scan-list { list-style: none; padding: 0; margin: 0; }
    .scan-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .scan-item:last-child { border-bottom: none; }
  </style>
  <script src="/js/lib/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Attendance Scanner</h1>
      </header>
      <div class="page-content">
        
        <div id="eventSelectContainer" style="margin-bottom: 24px;">
          <select id="eventSelector" class="form-control" style="max-width: 400px; padding: 10px;">
            <option value="">Select an Event to start scanning...</option>
          </select>
        </div>

        <div id="scannerSection" style="display: none;" class="scanner-container">
          <div class="event-bar">
            <div>
              <h2 id="evtTitle">Event Title</h2>
              <p id="evtDetails">Date • Venue</p>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 24px; font-weight: bold;" id="attendanceCount">0 / 0</div>
              <div style="font-size: 12px; color: #A3A3A3;">Present</div>
            </div>
          </div>

          <div id="reader"></div>

          <div class="controls">
            <button id="btnStart" class="btn btn-primary">Start Camera</button>
            <button id="btnStop" class="btn btn-secondary" style="display: none;">Stop Camera</button>
          </div>

          <div style="margin-top: 16px; display: flex; gap: 8px;">
            <input type="text" id="manualQrInput" placeholder="Manual QR Token (e.g. CH-XXXXXXXX)" class="form-control" style="padding: 8px 12px; text-transform: uppercase;">
            <button id="btnManualScan" class="btn btn-secondary" style="white-space: nowrap;">Check In</button>
          </div>

          <div id="statusArea" class="status-area status-neutral">
            Ready to scan
            <div class="status-detail" id="statusDetail">Point camera at a student's QR code</div>
          </div>

          <div class="recent-scans">
            <h3>Last 5 Scans</h3>
            <ul class="scan-list" id="recentScansList">
              <li class="text-muted text-center py-2">No scans yet</li>
            </ul>
          </div>
        </div>

      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth, requireRole } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';

    requireAuth();
    requireRole('CLUB_MEMBER');
    renderNavigation('CLUB_MEMBER');

    const eventSelector = document.getElementById('eventSelector');
    const scannerSection = document.getElementById('scannerSection');
    const statusArea = document.getElementById('statusArea');
    const statusDetail = document.getElementById('statusDetail');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const attendanceCount = document.getElementById('attendanceCount');
    const recentScansList = document.getElementById('recentScansList');
    
    let html5QrCode;
    let scannerLocked = false;
    let currentEventId = null;
    let recentScans = [];
    let stats = { present: 0, total: 0 };

    async function loadEvents() {
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch('/api/v1/events?scope=club', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (data.data && data.data.length > 0) {
          data.data.forEach(ev => {
            const opt = document.createElement('option');
            opt.value = ev.id;
            opt.textContent = ev.title;
            opt.dataset.date = ev.date;
            opt.dataset.venue = ev.venue;
            opt.dataset.capacity = ev.capacity;
            eventSelector.appendChild(opt);
          });

          const urlParams = new URLSearchParams(window.location.search);
          const eventId = urlParams.get('eventId');
          if (eventId) {
            eventSelector.value = eventId;
            selectEvent(eventId);
          } else if (data.data.length > 0) {
            eventSelector.value = data.data[0].id;
            selectEvent(data.data[0].id);
          }
        }
      } catch (err) {
        console.error('Error loading events:', err);
      }
    }

    function selectEvent(eventId) {
      if (!eventId) {
        scannerSection.style.display = 'none';
        return;
      }
      currentEventId = eventId;
      const opt = eventSelector.options[eventSelector.selectedIndex];
      
      document.getElementById('evtTitle').textContent = opt.textContent;
      document.getElementById('evtDetails').textContent = `${new Date(opt.dataset.date).toLocaleDateString()} • ${opt.dataset.venue || 'TBD'}`;
      stats.total = parseInt(opt.dataset.capacity || 0);
      
      scannerSection.style.display = 'block';
      updateStats();
      fetchCurrentStats();
    }

    async function fetchCurrentStats() {
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch(`/api/v1/events/${currentEventId}/attendance`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if(data.data) {
          stats.present = data.data.filter(r => r.attendanceStatus === 'PRESENT').length;
          stats.total = data.data.length; // Registered count
          updateStats();
        }
      } catch(e) { console.error(e); }
    }

    function updateStats() {
      attendanceCount.textContent = `${stats.present} / ${stats.total}`;
    }

    function updateRecentScans(name, rollNo, statusStr, isSuccess) {
      const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      recentScans.unshift({ name, rollNo, time, statusStr, isSuccess });
      if (recentScans.length > 5) recentScans.pop();

      recentScansList.innerHTML = recentScans.map(s => `
        <li class="scan-item">
          <div><strong>${s.name}</strong> (${s.rollNo})<br><span style="color:#A3A3A3;font-size:12px;">${s.time}</span></div>
          <div style="color: ${s.isSuccess ? '#166534' : '#991B1B'}; font-weight: 500;">${s.statusStr}</div>
        </li>
      `).join('');
    }

    function setStatus(type, mainText, detailText) {
      statusArea.className = `status-area status-${type}`;
      statusArea.innerHTML = `${mainText}<div class="status-detail">${detailText || ''}</div>`;
    }

    async function onScanSuccess(decodedText) {
      if (scannerLocked || !currentEventId) return;
      scannerLocked = true;
      setStatus('processing', 'Processing...', 'Verifying QR code...');

      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch(`/api/v1/events/${currentEventId}/attendance/scan`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ qrToken: decodedText })
        });
        
        const json = await res.json();

        if (res.ok && json.success) {
          const student = json.data || {};
          const sName = student.name || 'Student';
          const sRoll = student.rollNo || '';
          const timeStr = new Date(student.checkInTime || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          setStatus('success', '✓ ENTRY ALLOWED', `${sName}<br>Roll No: ${sRoll}<br><span style="font-size:12px;color:#166534;">Attendance Marked • ${timeStr}</span>`);
          stats.present++;
          updateStats();
          updateRecentScans(sName, sRoll, 'Allowed', true);
        } else {
          const errCode = json.error || json.message || '';
          let userMsg = 'Unable to mark attendance.';
          if (errCode === 'ALREADY_ATTENDED') {
            userMsg = 'Student has already checked in for this event.';
            setStatus('warning', 'Already Attended', userMsg);
          } else if (errCode === 'NOT_REGISTERED') {
            userMsg = 'Student is not registered for this event.';
            setStatus('error', '✕ ENTRY DENIED', userMsg);
          } else if (errCode === 'INVALID_QR') {
            userMsg = 'Invalid student QR code.';
            setStatus('error', '✕ ENTRY DENIED', userMsg);
          } else if (errCode === 'EVENT_NOT_ACTIVE') {
            userMsg = 'Event is not currently active for attendance.';
            setStatus('error', '✕ ENTRY DENIED', userMsg);
          } else {
            userMsg = json.error || 'Check event registration.';
            setStatus('error', '✕ ENTRY DENIED', userMsg);
          }
          updateRecentScans(errCode, '', 'Denied', false);
        }
      } catch (error) {
        setStatus('error', '✕ Network Error', 'Unable to connect to server.');
      }

      setTimeout(() => {
        if (scannerLocked) {
          setStatus('neutral', 'Ready to scan', 'Point camera at a student\'s QR code');
          scannerLocked = false;
        }
      }, 2500);
    }

    function onScanFailure(error) {
      // ignore
    }

    btnStart.addEventListener('click', async () => {
      html5QrCode = new Html5Qrcode("reader");
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess,
          onScanFailure
        );
        btnStart.style.display = 'none';
        btnStop.style.display = 'inline-block';
      } catch (err) {
        setStatus('error', 'Camera Error', 'Could not access camera. Please check permissions.');
      }
    });

    btnStop.addEventListener('click', async () => {
      if (html5QrCode) {
        await html5QrCode.stop();
        btnStart.style.display = 'inline-block';
        btnStop.style.display = 'none';
      }
    });

    const manualInput = document.getElementById('manualQrInput');
    const btnManualScan = document.getElementById('btnManualScan');
    if (btnManualScan && manualInput) {
      btnManualScan.addEventListener('click', () => {
        const val = manualInput.value.trim().toUpperCase();
        if (val) {
          onScanSuccess(val);
          manualInput.value = '';
        }
      });
      manualInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          btnManualScan.click();
        }
      });
    }

    eventSelector.addEventListener('change', (e) => {
      selectEvent(e.target.value);
      window.history.replaceState({}, '', `?eventId=${e.target.value}`);
    });

    document.addEventListener('DOMContentLoaded', loadEvents);

  </script>
</body>
</html>
