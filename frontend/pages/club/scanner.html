<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Scanner — CampusHub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusHub">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/club.css">
  <link rel="stylesheet" href="/css/scanner.css">
  <script src="/js/lib/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Attendance Scanner</h1>
      </header>
      <div class="page-content">

        <div id="eventSelectContainer" style="margin-bottom: 20px;">
          <select id="eventSelector" class="form-control" style="max-width: 420px; padding: 10px; font-size: 14px;">
            <option value="">Select an Event to start scanning...</option>
          </select>
        </div>

        <div id="scannerSection" style="display: none;" class="scanner-container">
          <div class="event-bar">
            <div>
              <h2 id="evtTitle">Event Title</h2>
              <p id="evtDetails">Date • Venue</p>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 26px; font-weight: 800;" id="attendanceCount">0 / 0</div>
              <div style="font-size: 12px; color: var(--color-text-muted); text-transform: uppercase; font-weight: 600;">Present</div>
            </div>
          </div>

          <!-- Camera Viewport with Visual Reticle and Animation Overlay -->
          <div class="camera-stage" id="cameraStage">
            <div id="reader"></div>

            <!-- Viewfinder Target Reticle -->
            <div class="viewfinder-reticle" id="viewfinderReticle">
              <div class="corner top-left"></div>
              <div class="corner top-right"></div>
              <div class="corner bottom-left"></div>
              <div class="corner bottom-right"></div>
              <div class="scan-laser"></div>
            </div>

            <!-- Full-Screen Camera Feedback Animation Overlay -->
            <div id="cameraFeedbackOverlay" class="camera-feedback-overlay">
              <div class="feedback-badge" id="feedbackBadge">
                <svg id="badgeIconSuccess" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <svg id="badgeIconError" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <svg id="badgeIconWarning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
              </div>
              <div class="feedback-title" id="feedbackTitle">ENTRY ALLOWED</div>
              <div class="feedback-name" id="feedbackName">Student Name</div>
              <div class="feedback-meta" id="feedbackMeta">Roll No: 101</div>
              <div class="feedback-reason" id="feedbackReason" style="display: none;"></div>
              <div class="feedback-time-pill" id="feedbackTimePill">10:24 AM</div>
            </div>
          </div>

          <div id="cameraErrorMsg" style="display: none; margin-top: 14px; padding: 12px 16px; background: var(--color-rose-light); border: 1.5px solid var(--color-rose); border-radius: 10px; font-size: 0.875rem; color: var(--color-rose); font-weight: 600;"></div>

          <div class="controls" style="margin-top: 14px;">
            <button id="btnStart" class="btn btn-primary" style="display: none; padding: 10px 24px; font-weight: 600;">Start Camera</button>
            <button id="btnStop" class="btn btn-secondary" style="display: inline-block; padding: 10px 24px; font-weight: 600;">Stop Camera</button>
          </div>

          <!-- Fallback Manual QR Input for Environments without Webcam -->
          <div style="margin-top: 14px; display: flex; gap: 8px;">
            <input type="text" id="manualQrInput" placeholder="Manual QR Token (e.g. CH-XXXXXXXX)" class="form-control" style="padding: 8px 12px; text-transform: uppercase;">
            <button id="btnManualScan" class="btn btn-secondary" style="white-space: nowrap;">Check In</button>
          </div>

          <div class="recent-scans">
            <h3>Recent Attendee Check-ins</h3>
            <ul class="scan-list" id="recentScansList">
              <li class="text-muted text-center py-2" style="font-size: 13px;">No scans yet for this session</li>
            </ul>
          </div>
        </div>

      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth, requireRole } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';

    requireAuth();
    requireRole('CLUB_MEMBER');
    renderNavigation('CLUB_MEMBER');

    const eventSelector = document.getElementById('eventSelector');
    const scannerSection = document.getElementById('scannerSection');
    const cameraStage = document.getElementById('cameraStage');
    const feedbackOverlay = document.getElementById('cameraFeedbackOverlay');
    const badgeIconSuccess = document.getElementById('badgeIconSuccess');
    const badgeIconError = document.getElementById('badgeIconError');
    const badgeIconWarning = document.getElementById('badgeIconWarning');
    const feedbackTitle = document.getElementById('feedbackTitle');
    const feedbackName = document.getElementById('feedbackName');
    const feedbackMeta = document.getElementById('feedbackMeta');
    const feedbackReason = document.getElementById('feedbackReason');
    const feedbackTimePill = document.getElementById('feedbackTimePill');
    const cameraErrorMsg = document.getElementById('cameraErrorMsg');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const attendanceCount = document.getElementById('attendanceCount');
    const recentScansList = document.getElementById('recentScansList');

    let html5QrCode = null;
    let isScanning = false;
    let scannerLocked = false;
    let currentEventId = null;
    let recentScans = [];
    let stats = { present: 0, total: 0 };
    let resetTimer = null;

    // Web Audio API tactile sound synthesizer
    function playSound(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          // Pleasant high chime
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
          osc.start();
          osc.stop(ctx.currentTime + 0.16);
        } else if (type === 'warning') {
          // Double chirp
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else {
          // Error buzz
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {
        // Audio policy or silent failure
      }
    }

    async function loadEvents() {
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch('/api/v1/events?scope=club', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (data.data && data.data.length > 0) {
          eventSelector.innerHTML = '<option value="">Select an Event...</option>';
          data.data.forEach(ev => {
            const opt = document.createElement('option');
            opt.value = ev.id;
            opt.textContent = ev.title;
            opt.dataset.date = ev.date || ev.eventDate;
            opt.dataset.venue = ev.venue || 'TBD';
            opt.dataset.capacity = ev.capacity;
            eventSelector.appendChild(opt);
          });

          const urlParams = new URLSearchParams(window.location.search);
          const eventId = urlParams.get('eventId');
          if (eventId) {
            eventSelector.value = eventId;
            selectEvent(eventId);
          } else if (data.data.length > 0) {
            eventSelector.value = data.data[0].id;
            selectEvent(data.data[0].id);
          }
        } else {
          eventSelector.innerHTML = '<option value="">No events found for this club</option>';
        }
      } catch (err) {
        console.error('Error loading events:', err);
      }
    }

    function selectEvent(eventId) {
      if (!eventId) {
        scannerSection.style.display = 'none';
        stopCamera();
        return;
      }
      currentEventId = eventId;
      const opt = eventSelector.options[eventSelector.selectedIndex];
      if (!opt) return;

      document.getElementById('evtTitle').textContent = opt.textContent;
      const dt = opt.dataset.date ? new Date(opt.dataset.date).toLocaleDateString() : '';
      document.getElementById('evtDetails').textContent = `${dt} • ${opt.dataset.venue || 'TBD'}`;
      stats.total = parseInt(opt.dataset.capacity || 0);

      scannerSection.style.display = 'block';
      updateStats();
      fetchCurrentStats();

      // Directly start camera upon selection
      startCamera();
    }

    async function fetchCurrentStats() {
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch(`/api/v1/events/${currentEventId}/attendance`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.data) {
          stats.present = data.data.filter(r => r.attendanceStatus === 'PRESENT').length;
          stats.total = data.data.length;
          updateStats();
        }
      } catch(e) { console.error(e); }
    }

    function updateStats() {
      attendanceCount.textContent = `${stats.present} / ${stats.total}`;
    }

    function updateRecentScans(name, rollNo, statusStr, isSuccess) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      recentScans.unshift({ name, rollNo, time, statusStr, isSuccess });
      if (recentScans.length > 5) recentScans.pop();

      recentScansList.innerHTML = recentScans.map(s => `
        <li class="scan-item">
          <div>
            <strong>${s.name}</strong> <span style="color:var(--color-text-secondary);">(${s.rollNo || 'N/A'})</span>
            <div style="color:var(--color-text-muted);font-size:12px;">${s.time}</div>
          </div>
          <div style="color: ${s.isSuccess ? 'var(--color-success)' : 'var(--color-error)'}; font-weight: 700;">
            ${s.statusStr}
          </div>
        </li>
      `).join('');
    }

    // Trigger Vibrant Camera Feedback Animation & Audio
    function showCameraAnimation(type, data) {
      clearTimeout(resetTimer);

      feedbackOverlay.className = `camera-feedback-overlay ${type}`;
      badgeIconSuccess.style.display = 'none';
      badgeIconError.style.display = 'none';
      badgeIconWarning.style.display = 'none';

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (type === 'approved') {
        badgeIconSuccess.style.display = 'block';
        feedbackTitle.textContent = 'ENTRY ALLOWED';
        feedbackName.textContent = data.name || 'Student';
        let metaParts = [];
        if (data.rollNo) metaParts.push(`Roll: ${data.rollNo}`);
        if (data.erpId) metaParts.push(`ERP: ${data.erpId}`);
        if (data.department) metaParts.push(data.department);
        if (data.division) metaParts.push(`Div: ${data.division}`);
        feedbackMeta.textContent = metaParts.join(' • ') || 'Student Verified';
        feedbackReason.style.display = 'none';
        feedbackTimePill.textContent = `Attendance Marked • ${timeStr}`;
        playSound('success');
      } else if (type === 'declined') {
        badgeIconError.style.display = 'block';
        feedbackTitle.textContent = 'ENTRY DENIED';
        feedbackName.textContent = data.title || 'Check Registration';
        feedbackMeta.textContent = '';
        feedbackReason.textContent = data.reason || 'Student is not registered for this event.';
        feedbackReason.style.display = 'block';
        feedbackTimePill.textContent = timeStr;
        playSound('error');
      } else if (type === 'warning') {
        badgeIconWarning.style.display = 'block';
        feedbackTitle.textContent = 'ALREADY ATTENDED';
        feedbackName.textContent = data.name || 'Duplicate Scan';
        feedbackMeta.textContent = `Roll No: ${data.rollNo || '-'}`;
        feedbackReason.textContent = data.reason || 'Student has already checked in.';
        feedbackReason.style.display = 'block';
        feedbackTimePill.textContent = timeStr;
        playSound('warning');
      }

      // Fast Reset: return to active camera scanning after 1.4 seconds
      resetTimer = setTimeout(() => {
        feedbackOverlay.className = 'camera-feedback-overlay';
        scannerLocked = false;
      }, 1400);
    }

    async function onScanSuccess(decodedText) {
      if (scannerLocked || !currentEventId) return;
      scannerLocked = true;

      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch(`/api/v1/events/${currentEventId}/attendance/scan`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ qrToken: decodedText })
        });

        const json = await res.json();

        if (res.ok && json.success) {
          const student = json.data || {};
          const sName = student.name || 'Student';
          const sRoll = student.rollNo || '';
          const sErp = student.erpId || '';
          const sDept = student.department || '';
          const sDiv = student.division || '';

          showCameraAnimation('approved', {
            name: sName,
            rollNo: sRoll,
            erpId: sErp,
            department: sDept,
            division: sDiv
          });

          stats.present++;
          updateStats();
          updateRecentScans(sName, sRoll, 'Allowed', true);
        } else {
          const errCode = json.error || json.message || '';
          let reason = 'Please verify student registration.';

          if (errCode === 'ALREADY_ATTENDED') {
            reason = 'Student has already checked in for this event.';
            showCameraAnimation('warning', { reason });
            updateRecentScans('Already Checked In', '', 'Duplicate', false);
          } else if (errCode === 'NOT_REGISTERED') {
            reason = 'Student is not registered for this event.';
            showCameraAnimation('declined', { title: 'Not Registered', reason });
            updateRecentScans('Not Registered', '', 'Denied', false);
          } else if (errCode === 'INVALID_QR') {
            reason = 'Unrecognized student QR code.';
            showCameraAnimation('declined', { title: 'Invalid QR Token', reason });
            updateRecentScans('Invalid QR', '', 'Denied', false);
          } else {
            reason = json.error || 'Registration check failed.';
            showCameraAnimation('declined', { title: 'Entry Denied', reason });
            updateRecentScans('Denied', '', 'Denied', false);
          }
        }
      } catch (error) {
        showCameraAnimation('declined', { title: 'Network Error', reason: 'Unable to connect to server' });
      }
    }

    function onScanFailure(error) {
      // Ignore background non-scan frames
    }

    async function startCamera() {
      if (isScanning) return;
      if (cameraErrorMsg) cameraErrorMsg.style.display = 'none';

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        cameraStage.classList.add('active-scanning');

        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 15,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
          },
          onScanSuccess,
          onScanFailure
        );
        btnStart.style.display = 'none';
        btnStop.style.display = 'inline-block';
        isScanning = true;
      } catch (err) {
        console.error('Camera startup error:', err);
        cameraStage.classList.remove('active-scanning');
        btnStart.style.display = 'inline-block';
        btnStop.style.display = 'none';
        isScanning = false;

        const isSecure = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        let tip = 'Camera access denied or unavailable. Use manual QR check-in below.';
        if (!isSecure) {
          tip = 'Mobile browsers require HTTPS for camera access. Access via HTTPS (or ngrok/tunnel), or use manual QR check-in below.';
        }
        if (cameraErrorMsg) {
          cameraErrorMsg.textContent = tip;
          cameraErrorMsg.style.display = 'block';
        }
      }
    }

    async function stopCamera() {
      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
        } catch (e) {
          console.warn('Camera stop error:', e);
        }
        cameraStage.classList.remove('active-scanning');
        btnStart.style.display = 'inline-block';
        btnStop.style.display = 'none';
        isScanning = false;
      }
    }

    btnStart.addEventListener('click', startCamera);
    btnStop.addEventListener('click', stopCamera);

    // Manual input fallback
    const manualInput = document.getElementById('manualQrInput');
    const btnManualScan = document.getElementById('btnManualScan');
    if (btnManualScan && manualInput) {
      btnManualScan.addEventListener('click', () => {
        const val = manualInput.value.trim().toUpperCase();
        if (val) {
          onScanSuccess(val);
          manualInput.value = '';
        }
      });
      manualInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          btnManualScan.click();
        }
      });
    }

    eventSelector.addEventListener('change', (e) => {
      selectEvent(e.target.value);
      window.history.replaceState({}, '', `?eventId=${e.target.value}`);
    });

    document.addEventListener('DOMContentLoaded', loadEvents);
  </script>
</body>
</html>
