<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Event — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/club.css">
  <style>
    .form-section { margin-bottom: 32px; padding: 24px; background: #fff; border: 1px solid #E6E6E6; border-radius: 8px; }
    .form-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .form-col { flex: 1; min-width: 250px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
    .form-group label { margin-bottom: 6px; font-weight: 500; color: #171717; }
    .form-control { padding: 10px; border: 1px solid #E6E6E6; border-radius: 6px; font-family: inherit; font-size: 14px; }
    .form-control:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .actions { display: flex; gap: 16px; justify-content: flex-end; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Edit Event</h1>
      </header>
      <div class="page-content">
        
        <form id="editEventForm" style="display: none;">
          
          <div class="form-section">
            <h2>Basic Information</h2>
            <div class="form-group">
              <label for="title">Event Title <span class="text-error">*</span></label>
              <input type="text" id="title" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" class="form-control" rows="4"></textarea>
            </div>
            <div class="form-row">
              <div class="form-col form-group">
                <label for="category">Category</label>
                <select id="category" class="form-control">
                  <option value="TECH">Technology</option>
                  <option value="CULTURAL">Cultural</option>
                  <option value="SPORTS">Sports</option>
                  <option value="ACADEMIC">Academic</option>
                  <option value="WORKSHOP">Workshop</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
              <div class="form-col form-group">
                <label for="status">Status</label>
                <select id="status" class="form-control">
                  <option value="DRAFT">Draft</option>
                  <option value="PUBLISHED">Published</option>
                  <option value="CANCELLED">Cancelled</option>
                  <option value="COMPLETED">Completed</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h2>Schedule & Location</h2>
            <div class="form-row">
              <div class="form-col form-group">
                <label for="date">Date <span class="text-error">*</span></label>
                <input type="date" id="date" class="form-control" required>
              </div>
              <div class="form-col form-group">
                <label for="startTime">Start Time <span class="text-error">*</span></label>
                <input type="time" id="startTime" class="form-control" required>
              </div>
              <div class="form-col form-group">
                <label for="endTime">End Time <span class="text-error">*</span></label>
                <input type="time" id="endTime" class="form-control" required>
              </div>
            </div>
            <div class="form-group">
              <label for="venue">Venue</label>
              <input type="text" id="venue" class="form-control">
            </div>
          </div>

          <div class="form-section">
            <h2>Capacity & Registration</h2>
            <div class="form-row">
              <div class="form-col form-group">
                <label for="capacity">Capacity (Seats) <span class="text-error">*</span></label>
                <input type="number" id="capacity" class="form-control" min="1" required>
              </div>
              <div class="form-col form-group">
                <label for="deadline">Registration Deadline <span class="text-error">*</span></label>
                <input type="datetime-local" id="deadline" class="form-control" required>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h2>Additional Details</h2>
            <div class="form-group">
              <label for="guest">Guest/Speaker Name</label>
              <input type="text" id="guest" class="form-control">
            </div>
            <div class="form-group">
              <label for="rules">Rules (One per line)</label>
              <textarea id="rules" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label for="poster">Event Poster (leave blank to keep current)</label>
              <input type="file" id="poster" class="form-control" accept="image/jpeg, image/png, image/webp">
              <div id="currentPoster" style="margin-top: 8px;"></div>
            </div>
          </div>

          <div id="errorMsg" class="text-error" style="display: none; margin-bottom: 16px;"></div>
          <div id="successMsg" class="text-success" style="display: none; margin-bottom: 16px;">Event updated successfully!</div>

          <div class="actions">
            <a href="/pages/club/manage-events.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" id="btnSave">Save Changes</button>
          </div>
        </form>
        <div id="loadingMsg" class="text-center text-muted" style="margin-top: 40px;">Loading event details...</div>

      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth, requireRole } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';

    requireAuth();
    requireRole('CLUB_MEMBER');
    renderNavigation('CLUB_MEMBER');

    const form = document.getElementById('editEventForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const btnSave = document.getElementById('btnSave');
    const loadingMsg = document.getElementById('loadingMsg');

    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');

    async function loadEvent() {
      if (!eventId) {
        loadingMsg.textContent = 'Event ID not found.';
        return;
      }
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch(`/api/v1/events/${eventId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to load event');
        const data = await res.json();
        const event = data.data;

        document.getElementById('title').value = event.title || '';
        document.getElementById('description').value = event.description || '';
        document.getElementById('category').value = event.category || 'OTHER';
        document.getElementById('status').value = event.status || 'DRAFT';
        
        if (event.date) {
          const d = new Date(event.date);
          document.getElementById('date').value = d.toISOString().split('T')[0];
        }
        document.getElementById('startTime').value = event.startTime || '';
        document.getElementById('endTime').value = event.endTime || '';
        document.getElementById('venue').value = event.venue || '';
        document.getElementById('capacity').value = event.capacity || 50;
        
        if (event.deadline) {
          const d = new Date(event.deadline);
          d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          document.getElementById('deadline').value = d.toISOString().slice(0, 16);
        }
        
        document.getElementById('guest').value = event.guest || '';
        document.getElementById('rules').value = event.rules || '';

        if (event.posterUrl) {
          document.getElementById('currentPoster').innerHTML = `<img src="${event.posterUrl}" alt="Current Poster" style="max-height: 100px; border-radius: 4px;">`;
        }

        loadingMsg.style.display = 'none';
        form.style.display = 'block';

      } catch (err) {
        loadingMsg.textContent = err.message;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      btnSave.disabled = true;

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value.trim());
      formData.append('description', document.getElementById('description').value.trim());
      formData.append('category', document.getElementById('category').value);
      formData.append('status', document.getElementById('status').value);
      formData.append('date', document.getElementById('date').value);
      formData.append('startTime', document.getElementById('startTime').value);
      formData.append('endTime', document.getElementById('endTime').value);
      formData.append('venue', document.getElementById('venue').value.trim());
      formData.append('capacity', document.getElementById('capacity').value);
      formData.append('deadline', document.getElementById('deadline').value);
      formData.append('guest', document.getElementById('guest').value.trim());
      formData.append('rules', document.getElementById('rules').value.trim());

      const posterFile = document.getElementById('poster').files[0];
      if (posterFile) {
        formData.append('poster', posterFile);
      }

      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch(`/api/v1/events/${eventId}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || 'Failed to update event');
        }

        successMsg.style.display = 'block';
        setTimeout(() => {
          window.location.href = '/pages/club/manage-events.html';
        }, 1500);

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btnSave.disabled = false;
      }
    });

    document.addEventListener('DOMContentLoaded', loadEvent);
  </script>
</body>
</html>
