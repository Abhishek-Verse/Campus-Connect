<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event — CampusHub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusHub">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/club.css">
  <style>
    .form-section { margin-bottom: 32px; padding: 24px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; }
    .form-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .form-col { flex: 1; min-width: 250px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
    .form-group label { margin-bottom: 6px; font-weight: 500; color: var(--color-text); }
    .form-control { padding: 10px; border: 1px solid var(--color-border); border-radius: 6px; font-family: inherit; font-size: 14px; }
    .form-control:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-focus-ring); }
    .actions { display: flex; gap: 16px; justify-content: flex-end; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Create Event</h1>
      </header>
      <div class="page-content">

        <form id="createEventForm">

          <div class="form-section">
            <h2>Basic Information</h2>
            <div class="form-group">
              <label for="title">Event Title <span class="text-error">*</span></label>
              <input type="text" id="title" class="form-control" required placeholder="e.g., Annual Tech Symposium">
            </div>
            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" class="form-control" rows="4" placeholder="Describe the event..."></textarea>
            </div>
            <div class="form-row">
              <div class="form-col form-group">
                <label for="category">Category</label>
                <select id="category" class="form-control">
                  <option value="TECH">Technology</option>
                  <option value="CULTURAL">Cultural</option>
                  <option value="SPORTS">Sports</option>
                  <option value="ACADEMIC">Academic</option>
                  <option value="WORKSHOP">Workshop</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h2>Schedule & Location</h2>
            <div class="form-row">
              <div class="form-col form-group">
                <label for="date">Date <span class="text-error">*</span></label>
                <input type="date" id="date" class="form-control" required>
              </div>
              <div class="form-col form-group">
                <label for="startTime">Start Time <span class="text-error">*</span></label>
                <input type="time" id="startTime" class="form-control" required>
              </div>
              <div class="form-col form-group">
                <label for="endTime">End Time <span class="text-error">*</span></label>
                <input type="time" id="endTime" class="form-control" required>
              </div>
            </div>
            <div class="form-group">
              <label for="venue">Venue</label>
              <input type="text" id="venue" class="form-control" placeholder="e.g., Main Auditorium">
            </div>
          </div>

          <div class="form-section">
            <h2>Capacity & Registration</h2>
            <div class="form-row">
              <div class="form-col form-group">
                <label for="capacity">Capacity (Seats) <span class="text-error">*</span></label>
                <input type="number" id="capacity" class="form-control" min="1" required value="50">
              </div>
              <div class="form-col form-group">
                <label for="deadline">Registration Deadline <span class="text-error">*</span></label>
                <input type="datetime-local" id="deadline" class="form-control" required>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h2>Additional Details</h2>
            <div class="form-group">
              <label for="guest">Guest/Speaker Name</label>
              <input type="text" id="guest" class="form-control" placeholder="Optional">
            </div>
            <div class="form-group">
              <label for="rules">Rules (One per line)</label>
              <textarea id="rules" class="form-control" rows="3" placeholder="ID Card mandatory..."></textarea>
            </div>
            <div class="form-group">
              <label for="poster">Event Poster</label>
              <input type="file" id="poster" class="form-control" accept="image/jpeg, image/png, image/webp">
              <small class="text-muted">Max size: 5MB</small>
            </div>
          </div>

          <div id="errorMsg" class="text-error" style="display: none; margin-bottom: 16px;"></div>
          <div id="successMsg" class="text-success" style="display: none; margin-bottom: 16px;">Event created successfully!</div>

          <div class="actions">
            <button type="button" class="btn btn-secondary" id="btnDraft">Save as Draft</button>
            <button type="submit" class="btn btn-primary" id="btnPublish">Publish Event</button>
          </div>
        </form>

      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth, requireRole } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';

    requireAuth();
    requireRole('CLUB_MEMBER');
    renderNavigation('CLUB_MEMBER');

    const form = document.getElementById('createEventForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const btnDraft = document.getElementById('btnDraft');
    const btnPublish = document.getElementById('btnPublish');

    async function saveEvent(status) {
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      const title = document.getElementById('title').value.trim();
      const date = document.getElementById('date').value;
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;
      const capacity = parseInt(document.getElementById('capacity').value, 10);
      const deadline = document.getElementById('deadline').value;

      // Validation
      if (!title || !date || !startTime || !endTime || !capacity || !deadline) {
        errorMsg.textContent = 'Please fill all required fields.';
        errorMsg.style.display = 'block';
        return;
      }
      if (startTime >= endTime) {
        errorMsg.textContent = 'End time must be after start time.';
        errorMsg.style.display = 'block';
        return;
      }
      if (capacity < 1) {
        errorMsg.textContent = 'Capacity must be at least 1.';
        errorMsg.style.display = 'block';
        return;
      }
      const eventDateTime = new Date(`${date}T${startTime}`);
      const deadlineDateTime = new Date(deadline);
      if (deadlineDateTime >= eventDateTime) {
        errorMsg.textContent = 'Registration deadline must be before the event starts.';
        errorMsg.style.display = 'block';
        return;
      }

      const formData = new FormData();
      formData.append('title', title);
      formData.append('description', document.getElementById('description').value.trim());
      formData.append('category', document.getElementById('category').value);
      formData.append('date', date);
      formData.append('startTime', startTime);
      formData.append('endTime', endTime);
      formData.append('venue', document.getElementById('venue').value.trim());
      formData.append('capacity', capacity);
      formData.append('deadline', deadline);
      formData.append('guest', document.getElementById('guest').value.trim());
      formData.append('rules', document.getElementById('rules').value.trim());
      formData.append('status', status);

      const posterFile = document.getElementById('poster').files[0];
      if (posterFile) {
        if (posterFile.size > 5 * 1024 * 1024) {
          errorMsg.textContent = 'Poster file exceeds 5MB limit.';
          errorMsg.style.display = 'block';
          return;
        }
        formData.append('poster', posterFile);
      }

      btnDraft.disabled = true;
      btnPublish.disabled = true;

      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch('/api/v1/events', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || 'Failed to create event');
        }

        successMsg.style.display = 'block';
        setTimeout(() => {
          window.location.href = '/pages/club/manage-events.html';
        }, 1500);

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btnDraft.disabled = false;
        btnPublish.disabled = false;
      }
    }

    btnDraft.addEventListener('click', () => saveEvent('DRAFT'));
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      saveEvent('PUBLISHED');
    });

  </script>
</body>
</html>
