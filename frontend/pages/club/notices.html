<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notices — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/club.css">
  <style>
    .notice-card { background: #fff; border: 1px solid #E6E6E6; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .notice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .notice-title { margin: 0; font-size: 16px; font-weight: 600; color: #171717; }
    .notice-meta { font-size: 12px; color: #8A8A8A; margin-top: 4px; }
    .notice-content { color: #4B5563; font-size: 14px; white-space: pre-wrap; margin-bottom: 16px; }
    .notice-actions { display: flex; gap: 8px; justify-content: flex-end; }
    
    .badge-normal { background: #F3F4F6; color: #4B5563; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;}
    .badge-important { background: #FEF3C7; color: #B45309; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;}
    .badge-urgent { background: #FEE2E2; color: #991B1B; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;}

    /* Modal styles */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #fff; padding: 24px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .modal h2 { margin-top: 0; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
    .form-group label { margin-bottom: 6px; font-weight: 500; font-size: 14px; }
    .form-control { padding: 10px; border: 1px solid #E6E6E6; border-radius: 6px; font-family: inherit; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Notice Management</h1>
        <button id="btnCreateNotice" class="btn btn-primary">Create Notice</button>
      </header>
      <div class="page-content">
        
        <div id="noticesList">
          <div class="text-center text-muted">Loading notices...</div>
        </div>

      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <!-- Modal -->
  <div class="modal-overlay" id="noticeModal">
    <div class="modal">
      <h2 id="modalTitle">Create Notice</h2>
      <form id="noticeForm">
        <input type="hidden" id="noticeId">
        <div class="form-group">
          <label for="title">Title <span class="text-error">*</span></label>
          <input type="text" id="title" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="content">Content <span class="text-error">*</span></label>
          <textarea id="content" class="form-control" rows="5" required></textarea>
        </div>
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" class="form-control">
            <option value="NORMAL">Normal</option>
            <option value="IMPORTANT">Important</option>
            <option value="URGENT">Urgent</option>
          </select>
        </div>
        <div class="form-group">
          <label for="relatedEvent">Related Event (Optional)</label>
          <select id="relatedEvent" class="form-control">
            <option value="">None</option>
          </select>
        </div>
        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" id="btnCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Notice</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, requireRole } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';

    requireAuth();
    requireRole('CLUB_MEMBER');
    renderNavigation('CLUB_MEMBER');

    const noticesList = document.getElementById('noticesList');
    const modal = document.getElementById('noticeModal');
    const form = document.getElementById('noticeForm');
    const relatedEventSelect = document.getElementById('relatedEvent');
    
    async function loadEvents() {
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch('/api/v1/events?scope=club', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.data) {
          data.data.forEach(ev => {
            const opt = document.createElement('option');
            opt.value = ev.id;
            opt.textContent = ev.title;
            relatedEventSelect.appendChild(opt);
          });
        }
      } catch (err) { console.error(err); }
    }

    async function loadNotices() {
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch('/api/v1/notices?scope=club', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (!data.data || data.data.length === 0) {
          noticesList.innerHTML = '<div class="text-center text-muted" style="padding: 40px;">No notices created yet.</div>';
          return;
        }

        noticesList.innerHTML = data.data.map(notice => `
          <div class="notice-card">
            <div class="notice-header">
              <div>
                <h3 class="notice-title">${notice.title}</h3>
                <div class="notice-meta">${new Date(notice.createdAt).toLocaleString()} ${notice.eventTitle ? `• Event: ${notice.eventTitle}` : ''}</div>
              </div>
              <span class="badge-${notice.priority.toLowerCase()}">${notice.priority}</span>
            </div>
            <div class="notice-content">${notice.content}</div>
            <div class="notice-actions">
              <button class="btn btn-sm btn-outline" onclick="window.editNotice('${notice.id}')">Edit</button>
              <button class="btn btn-sm btn-outline" style="color: #DC2626; border-color: #FCA5A5;" onclick="window.deleteNotice('${notice.id}')">Delete</button>
            </div>
          </div>
        `).join('');

        // Store data for editing
        window.noticesData = data.data;

      } catch (err) {
        noticesList.innerHTML = '<div class="text-error text-center">Failed to load notices.</div>';
      }
    }

    window.editNotice = (id) => {
      const notice = window.noticesData.find(n => n.id === id);
      if(!notice) return;
      document.getElementById('modalTitle').textContent = 'Edit Notice';
      document.getElementById('noticeId').value = notice.id;
      document.getElementById('title').value = notice.title;
      document.getElementById('content').value = notice.content;
      document.getElementById('priority').value = notice.priority;
      document.getElementById('relatedEvent').value = notice.eventId || '';
      modal.style.display = 'flex';
    };

    window.deleteNotice = async (id) => {
      if(!confirm('Are you sure you want to delete this notice?')) return;
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        await fetch(`/api/v1/notices/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        loadNotices();
      } catch (err) {
        alert('Failed to delete notice');
      }
    };

    document.getElementById('btnCreateNotice').addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = 'Create Notice';
      form.reset();
      document.getElementById('noticeId').value = '';
      modal.style.display = 'flex';
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('noticeId').value;
      const payload = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
        priority: document.getElementById('priority').value,
        eventId: document.getElementById('relatedEvent').value || null
      };

      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const url = id ? `/api/v1/notices/${id}` : '/api/v1/notices';
        const method = id ? 'PATCH' : 'POST';
        
        await fetch(url, {
          method,
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        modal.style.display = 'none';
        loadNotices();
      } catch (err) {
        alert('Failed to save notice');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadEvents();
      loadNotices();
    });
  </script>
</body>
</html>
