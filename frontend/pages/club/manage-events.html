<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events — CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/club.css">
  <style>
    .tabs { display: flex; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid #E6E6E6; }
    .tab { padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; color: #666; font-weight: 500; }
    .tab.active { border-bottom-color: #2563EB; color: #2563EB; }
    .badge { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .badge-draft { background: #F3F4F6; color: #4B5563; }
    .badge-published { background: #DBEAFE; color: #1D4ED8; }
    .badge-completed { background: #DCFCE7; color: #166534; }
    .badge-cancelled { background: #FEE2E2; color: #991B1B; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar">
        <h1>Manage Events</h1>
        <a href="/pages/club/create-event.html" class="btn btn-primary">Create New Event</a>
      </header>
      <div class="page-content">
        
        <div class="tabs" id="statusTabs">
          <div class="tab active" data-status="ALL">All</div>
          <div class="tab" data-status="DRAFT">Draft</div>
          <div class="tab" data-status="PUBLISHED">Published</div>
          <div class="tab" data-status="COMPLETED">Completed</div>
          <div class="tab" data-status="CANCELLED">Cancelled</div>
        </div>

        <div class="card">
          <div class="card-body">
            <table class="table" style="width: 100%; text-align: left;">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Date & Time</th>
                  <th>Venue</th>
                  <th>Status</th>
                  <th>Registrations</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="eventsTableBody">
                <tr><td colspan="6" class="text-center">Loading events...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <script type="module">
    import { requireAuth, requireRole } from '/js/auth/auth.js';
    import { renderNavigation } from '/js/utils/navigation.js';

    requireAuth();
    requireRole('CLUB_MEMBER');
    renderNavigation('CLUB_MEMBER');

    let allEvents = [];

    async function fetchEvents() {
      try {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const res = await fetch('/api/v1/events?scope=club', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        allEvents = data.data || [];
        renderEvents('ALL');
      } catch (err) {
        console.error('Failed to fetch events:', err);
        document.getElementById('eventsTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-error">Failed to load events.</td></tr>';
      }
    }

    function renderEvents(statusFilter) {
      const tbody = document.getElementById('eventsTableBody');
      const filtered = statusFilter === 'ALL' ? allEvents : allEvents.filter(e => e.status === statusFilter);

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No events found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(event => {
        const statusClass = `badge-${(event.status || 'draft').toLowerCase()}`;
        return `
          <tr>
            <td><strong>${event.title}</strong></td>
            <td>${new Date(event.date).toLocaleDateString()} ${event.startTime}</td>
            <td>${event.venue || 'TBD'}</td>
            <td><span class="badge ${statusClass}">${event.status}</span></td>
            <td>${event.registrationCount || 0} / ${event.capacity}</td>
            <td>
              <a href="/pages/club/edit-event.html?id=${event.id}" class="btn btn-sm btn-outline">Edit</a>
              <a href="/pages/club/registrations.html?eventId=${event.id}" class="btn btn-sm btn-outline">Registrations</a>
              <a href="/pages/club/scanner.html?eventId=${event.id}" class="btn btn-sm btn-primary">Scan</a>
            </td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('statusTabs').addEventListener('click', (e) => {
      if (e.target.classList.contains('tab')) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        renderEvents(e.target.dataset.status);
      }
    });

    document.addEventListener('DOMContentLoaded', fetchEvents);
  </script>
</body>
</html>
