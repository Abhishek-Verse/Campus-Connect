<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Student — CampusHub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script type="module" src="/js/utils/pwa.js"></script>
  <style>
    .auth-card-wide {
      width: 100%;
      max-width: 520px;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 32px 28px;
      box-shadow: var(--shadow-md);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 520px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card-wide">
    <div class="auth-logo">
      <a href="/" style="display: inline-block;">
        <img src="/assets/logo.png" alt="CampusHub Logo" style="height: 46px; max-width: 100%; object-fit: contain; margin-bottom: 8px;">
      </a>
      <p style="color: var(--color-text-secondary); font-size: 13px; font-weight: 500;">Create your student account & Universal QR pass</p>
    </div>
    
    <div id="auth-error"></div>
    
    <form id="register-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="name" class="form-label">Full Name <span class="text-error">*</span></label>
        <input type="text" id="name" name="name" class="form-input" required placeholder="e.g. Rahul Sharma">
      </div>
      
      <div class="form-group">
        <label for="email" class="form-label">GSuite / College Email Address <span class="text-error">*</span></label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="student@campushub.edu">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="rollNo" class="form-label">Roll Number <span class="text-error">*</span></label>
          <input type="text" id="rollNo" name="rollNo" class="form-input" required placeholder="e.g. 101 or 23">
        </div>
        <div class="form-group">
          <label for="erpId" class="form-label">ERP ID</label>
          <input type="text" id="erpId" name="erpId" class="form-input" placeholder="e.g. ERP-2026-4581">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="department" class="form-label">Department <span class="text-error">*</span></label>
          <select id="department" name="department" class="form-select" required>
            <option value="">Select Department...</option>
            <option value="Computer Engineering">Computer Engineering</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Artificial Intelligence & Data Science">AI & Data Science</option>
            <option value="Electronics & Telecommunication">Electronics & Telecom (EXTC)</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
            <option value="Chemical Engineering">Chemical Engineering</option>
            <option value="Electrical Engineering">Electrical Engineering</option>
            <option value="MCA / Computer Applications">MCA / Computer Applications</option>
            <option value="Management Studies">Management Studies</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="division" class="form-label">Division</label>
          <select id="division" name="division" class="form-select">
            <option value="">Select Division...</option>
            <option value="A">Division A</option>
            <option value="B">Division B</option>
            <option value="C">Division C</option>
            <option value="D">Division D</option>
          </select>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="text-error">*</span></label>
          <input type="password" id="password" name="password" class="form-input" required minlength="6" placeholder="Min 6 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password <span class="text-error">*</span></label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required minlength="6" placeholder="Confirm password">
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary w-full mt-2" style="padding: 10px;">Create Account & Generate QR</button>
    </form>
    
    <div style="margin-top: 14px; text-align: center;">
      <button type="button" id="fillSampleDataBtn" class="demo-chip-btn" style="margin: 0 auto;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Fill Sample Student Data
      </button>
    </div>

    <div class="auth-footer">
      Already registered? <a href="/pages/auth/login.html">Sign in here</a>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api/client.js';
    import { setToken, setUser, isAuthenticated, getUserRole } from '/js/auth/auth.js';
    import { qs, preventDoubleSubmit } from '/js/utils/helpers.js';

    const form = qs('#register-form');
    const errorDiv = qs('#auth-error');
    const btn = form.querySelector('button[type="submit"]');

    // Fill sample student details for testing
    qs('#fillSampleDataBtn').addEventListener('click', () => {
      const rand = Math.floor(Math.random() * 900) + 100;
      qs('#name').value = `Aryan Sharma`;
      qs('#email').value = `aryan${rand}@campushub.edu`;
      qs('#rollNo').value = `${rand}`;
      qs('#erpId').value = `ERP-2026-${rand}`;
      qs('#department').value = 'Computer Engineering';
      qs('#division').value = 'A';
      qs('#password').value = 'password123';
      qs('#confirmPassword').value = 'password123';
    });

    preventDoubleSubmit(form);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.textContent = '';
      errorDiv.style.display = 'none';
      
      const name = qs('#name').value.trim();
      const rollNo = qs('#rollNo').value.trim();
      const erpId = qs('#erpId').value.trim();
      const department = qs('#department').value;
      const division = qs('#division').value;
      const email = qs('#email').value.trim();
      const password = qs('#password').value;
      const confirmPassword = qs('#confirmPassword').value;
      
      if (!name || !email || !rollNo || !password) {
        errorDiv.textContent = 'Please fill in all required fields.';
        errorDiv.style.display = 'flex';
        return;
      }

      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters long.';
        errorDiv.style.display = 'flex';
        return;
      }

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.style.display = 'flex';
        return;
      }
      
      btn.textContent = 'Generating QR Pass...';
      btn.disabled = true;
      
      try {
        const payload = {
          name,
          rollNo,
          email,
          password,
          erpId,
          department,
          division,
          role: 'STUDENT'
        };

        const response = await api.auth.register(payload);
        const token = response.data?.token || response.token;
        const user = response.data?.user || response.user;

        if (token && user) {
          setToken(token);
          setUser(user);
          window.location.href = '/pages/student/dashboard.html';
        } else {
          window.location.href = '/pages/auth/login.html?registered=true';
        }
      } catch (error) {
        errorDiv.textContent = error.message || 'Registration failed. Please try again.';
        errorDiv.style.display = 'flex';
        btn.textContent = 'Create Account & Generate QR';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
