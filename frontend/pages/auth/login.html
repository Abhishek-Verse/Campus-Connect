<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" style="display: inline-block;">
        <img src="/assets/logo.png" alt="CampusHub Logo" style="height: 48px; max-width: 100%; object-fit: contain; margin-bottom: 8px;">
      </a>
      <p id="portalSubtitle" style="color: #64748b; font-size: 13px; font-weight: 500;">Sign in to your account</p>
    </div>

    <!-- Dual Portal Navigation Tabs (No emojis) -->
    <div class="portal-tabs">
      <button type="button" class="portal-tab active" id="tabStudent">Student Portal</button>
      <button type="button" class="portal-tab" id="tabClub">Club Portal</button>
    </div>

    <div class="portal-desc" id="portalDesc">
      <strong>Student Access:</strong> Discover events, view your attendance history, and present your unique Universal QR code.
    </div>
    
    <div id="auth-error"></div>
    
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label" id="labelEmail">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="student@campushub.edu" required autofocus autocomplete="email">
      </div>
      
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="margin-top: 6px;">
      </div>
      
      <button type="submit" class="btn btn-primary w-full mt-2" id="submitBtn">Sign In as Student</button>
    </form>

    <div class="auth-footer" id="authFooter">
      Don't have a student account? <a href="/pages/auth/register.html">Register here</a>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api/client.js';
    import { setToken, setUser, isAuthenticated, getUserRole } from '/js/auth/auth.js';
    import { qs, preventDoubleSubmit } from '/js/utils/helpers.js';

    let currentPortal = 'STUDENT'; // 'STUDENT' or 'CLUB'

    const tabStudent = qs('#tabStudent');
    const tabClub = qs('#tabClub');
    const portalSubtitle = qs('#portalSubtitle');
    const portalDesc = qs('#portalDesc');
    const labelEmail = qs('#labelEmail');
    const inputEmail = qs('#email');
    const submitBtn = qs('#submitBtn');
    const authFooter = qs('#authFooter');
    const form = qs('#login-form');
    const errorDiv = qs('#auth-error');

    function switchPortal(portal) {
      currentPortal = portal;
      errorDiv.textContent = '';
      errorDiv.style.display = 'none';

      if (portal === 'STUDENT') {
        tabStudent.classList.add('active');
        tabClub.classList.remove('active');
        portalSubtitle.textContent = 'Student Portal Login';
        portalDesc.innerHTML = '<strong>Student Access:</strong> Discover events, view your attendance history, and present your unique Universal QR code.';
        labelEmail.textContent = 'Email Address';
        inputEmail.placeholder = 'student@campushub.edu';
        submitBtn.textContent = 'Sign In as Student';
        authFooter.style.display = 'block';
      } else {
        tabClub.classList.add('active');
        tabStudent.classList.remove('active');
        portalSubtitle.textContent = 'Club Organizer Portal Login';
        portalDesc.innerHTML = '<strong>Club Access:</strong> Every club has dedicated credentials to manage events, attendance scanner, and notices.';
        labelEmail.textContent = 'Official Club Email';
        inputEmail.placeholder = 'club@campushub.edu';
        submitBtn.textContent = 'Sign In to Club Portal';
        authFooter.style.display = 'none';
      }
      inputEmail.focus();
    }

    tabStudent.addEventListener('click', () => switchPortal('STUDENT'));
    tabClub.addEventListener('click', () => switchPortal('CLUB'));

    // Check URL parameters for tab hint e.g. ?portal=club or registration success
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('portal') === 'club') {
      switchPortal('CLUB');
    }
    if (urlParams.get('registered') === 'true') {
      errorDiv.className = 'credentials-hint';
      errorDiv.style.background = '#f0fdf4';
      errorDiv.style.borderColor = '#86efac';
      errorDiv.style.color = '#15803d';
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Account created successfully! Please sign in with your email address.';
    }

    preventDoubleSubmit(form);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.textContent = '';
      errorDiv.style.display = 'none';
      
      const email = inputEmail.value.trim();
      const password = qs('#password').value;
      
      submitBtn.textContent = 'Authenticating...';
      submitBtn.disabled = true;
      
      try {
        const response = await api.auth.login({ email, password });
        const token = response.data?.token || response.token;
        const user = response.data?.user || response.user;
        
        if (!token || !user) {
          throw new Error('Invalid response from server');
        }

        const role = (user.role || '').toUpperCase();
        const isClub = (role === 'CLUB_MEMBER' || role === 'ADMIN' || user.isClubMember);

        // Strict Separation:
        // 1. Student Portal Tab
        if (currentPortal === 'STUDENT') {
          if (isClub) {
            submitBtn.textContent = 'Sign In as Student';
            submitBtn.disabled = false;
            errorDiv.innerHTML = 'Notice: This is an official club account. Please switch to the <strong>Club Portal</strong> tab to sign in.';
            errorDiv.style.display = 'block';
            return;
          }
          setToken(token);
          setUser(user);
          window.location.href = '/pages/student/dashboard.html';
          return;
        }

        // 2. Club Portal Tab
        if (currentPortal === 'CLUB') {
          if (!isClub) {
            submitBtn.textContent = 'Sign In to Club Portal';
            submitBtn.disabled = false;
            errorDiv.innerHTML = 'Access Denied: Student accounts cannot log into the Club Portal. Please switch to the <strong>Student Portal</strong> tab to sign in.';
            errorDiv.style.display = 'block';
            return;
          }
          setToken(token);
          setUser(user);
          window.location.href = '/pages/club/dashboard.html';
          return;
        }

      } catch (error) {
        let msg = error.message || 'Login failed. Please check your credentials.';
        if (msg.toLowerCase().includes('invalid credentials')) {
          msg = 'Invalid email or password. If you do not have an account yet, <a href="/pages/auth/register.html" style="font-weight: 600; text-decoration: underline;">register here</a>.';
        }
        errorDiv.innerHTML = msg;
        errorDiv.style.display = 'block';
        submitBtn.textContent = currentPortal === 'CLUB' ? 'Sign In to Club Portal' : 'Sign In as Student';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
