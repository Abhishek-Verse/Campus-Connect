<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusHub</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>CampusHub</h1>
      <p>Sign in to your account</p>
    </div>
    
    <div id="auth-error"></div>
    
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-input" required autofocus>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" required>
      </div>
      
      <button type="submit" class="btn btn-primary w-full mt-2">Login</button>
    </form>
    
    <div class="auth-footer">
      Don't have an account? <a href="/pages/auth/register.html">Register here</a>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api/client.js';
    import { setToken, setUser, isAuthenticated, getUserRole } from '/js/auth/auth.js';
    import { qs, preventDoubleSubmit } from '/js/utils/helpers.js';

    // Redirect if already logged in
    if (isAuthenticated()) {
      const role = (getUserRole() || '').toUpperCase();
      window.location.href = (role === 'CLUB_MEMBER' || role === 'ADMIN') ? '/pages/club/dashboard.html' : '/pages/student/dashboard.html';
    }

    const form = qs('#login-form');
    const errorDiv = qs('#auth-error');
    const btn = form.querySelector('button[type="submit"]');

    preventDoubleSubmit(form);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.textContent = '';
      
      const email = qs('#email').value;
      const password = qs('#password').value;
      
      btn.textContent = 'Logging in...';
      
      try {
        const response = await api.auth.login({ email, password });
        const token = response.data?.token || response.token;
        const user = response.data?.user || response.user;
        
        if (!token || !user) {
          throw new Error('Invalid response from server');
        }

        setToken(token);
        setUser(user);
        
        const role = (user.role || '').toUpperCase();
        if (role === 'CLUB_MEMBER' || role === 'ADMIN') {
          window.location.href = '/pages/club/dashboard.html';
        } else {
          window.location.href = '/pages/student/dashboard.html';
        }
      } catch (error) {
        errorDiv.textContent = error.message || 'Login failed. Please check your credentials.';
        btn.textContent = 'Login';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
